name: Build and run functional tests using ragger through reusable workflow

# Phase 0 bootstrap simplification: only the build step runs.
# Ragger functional tests will be re-added in Phase 2 (hardening) once Radiant-specific
# tests exist. For the bootstrap we just need a green build to validate the pinned
# toolchain.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "compiled_app_binaries"
      flags: "COIN=bitcoin_cash"
