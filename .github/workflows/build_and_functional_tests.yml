name: Build (Phase 1)

# Matrix-builds both variants:
# - bitcoin_cash: regression smoke test — proves we haven't broken upstream
# - radiant: the new v1 variant we're shipping

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Build COIN=${{ matrix.coin }} for Nano S Plus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coin: [bitcoin_cash, radiant]
    container:
      # Pinned multi-arch index digest (resolved 2026-04-15).
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-lite@sha256:b82bfff7862d890ea0c931f310ed1e9bce6efe2fac32986a2561aaa08bfc2834

    steps:
      - name: Checkout with submodule
        uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709  # v4.1.7
        with:
          submodules: recursive

      - name: Build
        env:
          SOURCE_DATE_EPOCH: 0
          PYTHONHASHSEED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          make COIN=${{ matrix.coin }} BOLOS_SDK=$NANOSP_SDK
          sha256sum bin/app.hex bin/app.elf > bin/SHA256SUMS
          echo "=== bin/SHA256SUMS for COIN=${{ matrix.coin }} ==="
          cat bin/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: compiled_app_${{ matrix.coin }}
          path: |
            bin/app.hex
            bin/app.elf
            bin/SHA256SUMS
          if-no-files-found: error
